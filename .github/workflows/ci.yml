name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Same Godot version as project.godot. The tag carries no "-stable"
      # suffix, and the image puts the binary on PATH as `godot`, which is what
      # tools/test.sh falls back to when $GODOT is unset.
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Import, check every script, run the test suite
        # The same one command a developer runs; it fails on a script that does
        # not compile as well as on a failing test.
        run: tools/test.sh

  determinism:
    name: Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Import
        run: godot --headless --path . --import

      - name: The same seed twice, with the invariants and the replay checked
        # Two full runs of the real world. `--check` stops at the first broken
        # invariant, `--replay` proves the command log reproduces the run, and
        # the two hashes catch anything that is not reproducible at all — an
        # unseeded generator, an iteration order that depends on a pointer.
        shell: bash
        run: |
          set -euo pipefail
          run_once() {
            godot --headless --path . -s tools/sim_run.gd -- \
              --seed=1 --policy=greedy --check --replay | tail -n 1
          }
          first=$(run_once)
          second=$(run_once)
          echo "$first"
          if [ "$first" != "$second" ]; then
            echo "the same seed gave two different runs:"
            echo "  $first"
            echo "  $second"
            exit 1
          fi

  export-smoke:
    name: Export and smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Export templates where Godot looks for them
        # The image keeps them under /root; the container's HOME is /github/home
        # (release.md §9.1).
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/

      - name: Import
        run: godot --headless --path . --import

      - name: Export the Linux build
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" build/linux/Doomsday.x86_64

      - name: The exported build plays the reference run
        # release.md §8: a bot run in the real session, exit 0, the same outcome,
        # day and hash as tools/sim_run.gd.
        shell: bash
        run: tools/ci/smoke_check.sh build/linux/Doomsday.x86_64
